version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate_autopilot_app
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@postgres_db:5432/affiliate_autopilot?schema=public
      - NODE_ENV=production
      - MERCADO_LIVRE_AFFILIATE_TAG=THOMAZ85
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autopilot_net

  postgres:
    image: postgres:16-alpine
    container_name: affiliate_autopilot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: affiliate_autopilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      autopilot_net:
        aliases:
          - postgres_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  autopilot_net:
    driver: bridge
